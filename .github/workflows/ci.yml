# mvn verify on every push to main and every pull request.
# - Windows: the broker's discovery pipe is Windows-only, so this is the platform the tests matter on.
# - Maven pinned to 3.9: polyglot-yaml (.mvn/extensions.xml) does not load on Maven 4.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MAVEN_VERSION: 3.9.16
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: '**/pom.yml'

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\maven.zip"
          Invoke-WebRequest "https://archive.apache.org/dist/maven/maven-3/$env:MAVEN_VERSION/binaries/apache-maven-$env:MAVEN_VERSION-bin.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\apache-maven-$env:MAVEN_VERSION\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
