modelVersion: 4.0.0

groupId: io.minaret
artifactId: minaret
version: 0.1.0-SNAPSHOT
packaging: pom

name: "Minaret"
description:
  A message bus the broker, the Java client runtime and runnable examples, built as one reactor.

# broker is a module but not a child: it inherits from micronaut-parent, and a POM has one parent.
modules:
  - runtime
  - broker
  - examples
  - benchmark

properties:
  project.build.sourceEncoding: UTF-8
  maven.compiler.release: 17
  jackson.version: 2.22.1
  junit.version: 6.1.2

dependencyManagement:
  dependencies:
    - groupId: io.minaret
      artifactId: runtime
      version: ${project.version}
    - groupId: com.fasterxml.jackson.core
      artifactId: jackson-databind
      version: ${jackson.version}
    - groupId: org.junit.jupiter
      artifactId: junit-jupiter
      version: ${junit.version}

build:
  pluginManagement:
    plugins:
      - artifactId: maven-compiler-plugin
        version: 3.15.0
      - artifactId: maven-surefire-plugin
        version: 3.5.6
